<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Globe + Countries + Attacks + RSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
      user-select: none; /* helps with dragging the RSS window */
    }

    /* Basic UI Container for Attacks Buttons */
    #ui {
      position: absolute;
      top: 10px; left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }
    button {
      padding: 6px 12px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      cursor: pointer;
      font-family: sans-serif;
    }
    button:hover {
      background: #444;
    }

    /* RSS Window styling */
    #rss-window {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 400px;
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid #0ff; /* neon border */
      color: #0ff;           /* neon text color */
      font-family: sans-serif;
      display: none; /* hidden by default; you can show it by default if you prefer */
      z-index: 1000; /* above the globe & other elements */
    }
    #rss-title-bar {
      background: #111;
      padding: 6px;
      cursor: move; /* drag handle */
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #rss-close-btn {
      cursor: pointer;
      padding: 2px 6px;
      background: #333;
      border: 1px solid #999;
      color: #fff;
    }
    #rss-close-btn:hover {
      background: #555;
    }
    #rss-content {
      padding: 8px;
      max-height: 300px;
      overflow-y: auto; /* scroll if content is too large */
    }
    #rss-form {
      margin-bottom: 8px;
      display: flex;
      gap: 4px;
    }
    #rss-url-input {
      flex: 1;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 4px;
    }
    #rss-load-btn {
      background: #222;
      color: #0ff;
      border: 1px solid #555;
      cursor: pointer;
    }
    #rss-load-btn:hover {
      background: #444;
    }

  </style>

  <!-- Importmap for Three.js and OrbitControls -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
      "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Attack Buttons -->
  <div id="ui">
    <button id="stopAttacksBtn">Stop Attacks</button>
    <button id="newAttackBtn">New Attack</button>
    <button id="clearAttacksBtn">Clear Attacks</button>
  </div>

  <!-- RSS Window -->
  <div id="rss-window">
    <div id="rss-title-bar">
      <span>RSS Feed Reader</span>
      <span id="rss-close-btn">X</span>
    </div>
    <div id="rss-content">
      <div id="rss-form">
        <input type="text" id="rss-url-input" placeholder="Enter RSS feed URL" />
        <button id="rss-load-btn">Load RSS</button>
      </div>
      <div id="rss-output"></div>
    </div>
  </div>

  <!-- Main script: the globe, countries, attacks, and RSS code -->
  <script type="module" src="index.js"></script>
</body>
</html>
